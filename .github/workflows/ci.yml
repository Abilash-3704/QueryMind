name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -e "backend[dev]"

      - name: Run tests
        run: pytest backend/tests -v

      - name: Lint
        run: ruff check backend/app backend/tests eval --config backend/pyproject.toml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # No standalone eslint is configured (frontend/package.json has no "lint" script) —
      # `npm run build` runs `tsc --noEmit` first, which is the project's actual type-check
      # gate. Add a real lint step here if eslint gets set up later.
      - name: Build (includes TypeScript type-check)
        run: npm run build
