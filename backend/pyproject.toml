[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # LLM providers
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    # Orchestration
    "langgraph>=0.2.0",
    # Database
    "duckdb>=1.1.0",
    # SQL parsing (used for guardrails in Phase 2, imported as a dep now)
    "sqlglot>=25.0.0",
    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Web (Phase 3+)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # HTTP (bootstrap script)
    "httpx>=0.27.0",
    # Env loading (scripts, eval harness)
    "python-dotenv>=1.0.0",
    # Progress bars (eval harness)
    "tqdm>=4.66.0",
    # Observability (Phase 5)
    "langfuse>=4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
